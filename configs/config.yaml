defaults:
  - data: tinystories
  - tokenizer: bpe
  - model: gpt100m
  - train: default
  - attention: default
  - _self_
  - experiment: null

# 默认只检查已有数据，下载需明确指定 stat=prepare。
stat: inspect

progress:
  enabled: true
  min_interval: 0.5

inspect:
  samples: 3
  preview_chars: 300

benchmark:
  warmup_steps: 5
  steps: 20
  estimate_tokens: 100000000

eval:
  checkpoint: ${train.output_dir}/best.pt
  max_tokens: null

generate:
  checkpoint: ${eval.checkpoint}
  prompt: "Once upon a time, there was a little cat."
  max_new_tokens: 128
  temperature: 0.8
  top_k: 50
  seed: 123

hydra:
  job:
    chdir: false
  run:
    dir: runs/${stat}/${now:%Y-%m-%d_%H-%M-%S_%f}
  sweep:
    dir: runs/multirun/${now:%Y-%m-%d_%H-%M-%S_%f}
    subdir: ${hydra.job.num}
